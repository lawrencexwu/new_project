name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build workbook templates
        run: python -m xl.build_workbooks

      - name: Upload built workbooks as artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbook-templates
          path: build/*.xlsx
          retention-days: 7
